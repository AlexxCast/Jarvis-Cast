name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server e web (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check web/app.js

  android:
    name: App Android (test e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # gradle.properties punta al JDK del PC di sviluppo: in CI si usa quello appena installato.
      - run: ./gradlew --no-daemon "-Dorg.gradle.java.home=$JAVA_HOME" testDebugUnitTest assembleDebug
      # L'APK compilato resta scaricabile per 14 giorni dalla pagina del run (va poi firmato con la chiave del telefono).
      - uses: actions/upload-artifact@v4
        with:
          name: jarvis-apk-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
