name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server e web (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node --check web/app.js
      # Ascolto dal microfono del PC: logica della chiamata e rilevatore di voce (riconoscimento finto).
      - run: pip install numpy && cd desktop && python -m unittest test_ascolto && python -m py_compile jarvis_desktop.py

  android:
    name: App Android (test e build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      # Riconoscimento forte di "Kestra": modello e librerie sherpa-onnx (se mancano l'app usa il metodo di Android).
      - name: Scarica il riconoscimento della parola Kestra
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash scripts/fetch_kws.sh
      # gradle.properties punta al JDK del PC di sviluppo: in CI si usa quello appena installato.
      - run: ./gradlew --no-daemon "-Dorg.gradle.java.home=$JAVA_HOME" testDebugUnitTest assembleDebug
