name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "*.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Ripara Gradle Wrapper e Compila APK
        run: |
          # Scarica una distribuzione pulita di Gradle 8.9 (compatibile con AGP 8.x)
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          
          # Rigenera i file del wrapper (gradlew e gradle-wrapper.jar) direttamente sul runner
          /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x ./gradlew
          
          # Avvia la build usando il wrapper appena generato
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/*.apk Jarvis.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Jarvis APK (ultima build)
          files: Jarvis.apk
