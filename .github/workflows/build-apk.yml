name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "*.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rinomina
        run: cp app/build/outputs/apk/debug/*.apk Jarvis.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Jarvis APK (ultima build)
          files: Jarvis.apk
