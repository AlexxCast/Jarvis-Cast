name: Build APK

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "*.kts"
      - "gradle.properties"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          # Se il tuo gradle-wrapper.jar nel repo è corrotto o mancante,
          # specificare 'gradle-version: wrapper' (default) fallisce.
          # Impostando una versione esplicita (es. 8.7 o 8.9), GitHub Actions
          # scarica ed esegue Gradle anche senza il jar nel repository:
          gradle-version: '8.7'

      - name: Compila APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/*.apk Jarvis.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-apk
          path: Jarvis.apk

      - name: Pubblica release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Jarvis APK (ultima build)
          files: Jarvis.apk
