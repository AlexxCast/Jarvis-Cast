<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jarvis</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; font: 14px/1.3 system-ui, -apple-system, Roboto, sans-serif; color: #e5f6e5; }
    #wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; padding: 6px 10px; }
    #orbbox { display: inline-flex; align-items: center; gap: 8px; background: rgba(5,14,6,.84); border: 1px solid rgba(57,255,20,.28); border-radius: 36px; padding: 4px 12px 4px 5px;
      max-width: min(76vw, 260px); box-shadow: 0 2px 12px rgba(0,0,0,.45), 0 0 10px rgba(57,255,20,.18); transition: opacity .25s, transform .25s; }
    #orbbox:has(#say:empty) { padding: 4px; gap: 0; }
    #orbbox.hide { opacity: 0; transform: translateY(-8px) scale(.92); }
    #orb { width: 56px; height: 56px; flex: none; }
    #say { max-width: 44vw; font-size: .78rem; line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    #say:empty { display: none; }
    #card { width: 100%; transition: opacity .35s; }
    #card.gone { opacity: 0; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="orbbox" class="hide"><canvas id="orb" width="180" height="180"></canvas><div id="say"></div></div>
    <div id="card"></div>
  </div>
  <script type="module" src="/overlay.js"></script>
</body>
</html>
